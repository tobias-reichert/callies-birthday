  <!-- ── countdown ── -->
  <script>
  (function() {
    const { useState, useEffect } = React;

    function useCountdown(targetIso) {
      const [now, setNow] = useState(() => Date.now());
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, []);
      const target = new Date(targetIso).getTime();
      const diff = Math.max(0, target - now);
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      return { d, h, m, s, done: diff === 0 };
    }

    const Countdown = ({ targetIso }) => {
      const { d, h, m, s, done } = useCountdown(targetIso);
      const pad = (n) => String(n).padStart(2, '0');
      const cellStyle = {
        flex: 1, textAlign: 'center', padding: '10px 4px 8px',
        borderRight: '1px solid rgba(184,137,58,0.35)',
      };
      const numStyle = {
        fontFamily: 'MedievalSharp, serif', fontSize: 28, lineHeight: 1,
        color: 'var(--ink)', fontVariantNumeric: 'tabular-nums', letterSpacing: '0.02em',
      };
      const labelStyle = {
        fontFamily: 'IM Fell English, serif', fontStyle: 'italic', fontSize: 14,
        letterSpacing: '0.12em', textTransform: 'lowercase', color: 'var(--ink-soft)', marginTop: 4,
      };
      if (done) return html`
        <div style=${{ textAlign:'center', padding:'14px 12px', fontFamily:'MedievalSharp, serif', fontSize: 20, color: 'var(--green-deep)' }}>
          The Fellowship has gathered!
        </div>`;
      const cells = [[pad(d),'days'],[pad(h),'hours'],[pad(m),'minutes'],[pad(s),'seconds']];
      return html`
        <div>
          <div style=${{ display:'flex', background:'linear-gradient(180deg,rgba(255,243,200,0.35),rgba(201,163,74,0.12))', border:'1px solid rgba(184,137,58,0.45)', borderRadius:3, boxShadow:'inset 0 1px 0 rgba(255,255,255,0.35),0 1px 2px rgba(60,40,15,0.15)' }}>
            ${cells.map(([n,l],i,arr) => html`
              <div key=${l} style=${{ ...cellStyle, borderRight: i===arr.length-1?'none':cellStyle.borderRight }}>
                <div style=${numStyle}>${n}</div>
                <div style=${labelStyle}>${l}</div>
              </div>`)}
          </div>
          <div style=${{ textAlign:'center', marginTop:8, fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:16, color:'var(--ink-soft)' }}>
            until the Fellowship of Friends
          </div>
        </div>`;
    };

    window.Countdown = Countdown;
  })();
  </script>

      const [wasAdded, setWasAdded] = useState(false);
      const inputRef = useRef(null);
      const submit = (e) => {
        e && e.preventDefault();
        const n = name.trim();
        if (!n) { inputRef.current && inputRef.current.focus(); return; }
        onAdd(n); setName(''); setWasAdded(true);
        setTimeout(() => setWasAdded(false), 2400);
      };
      return html`
        <form onSubmit=${submit} style=${{ display:'flex', flexDirection:'column', gap:10 }}>
          <label style=${{ fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:17, color:'var(--ink-soft)', marginBottom:-2 }}>
            Your name (or names, if a party travels together)
          </label>
          <input ref=${inputRef} type="text" value=${name}
            onChange=${(e) => setName(e.target.value)}
            placeholder="e.g. Bilbo & Frodo"
            style=${parchmentField} maxLength="80" />
          <button type="submit" style=${goldButton('solid')}>
            <span style=${{ fontSize:14, marginRight:2 }}>✦</span> I'm Coming
          </button>
          <div style=${{ minHeight:18, textAlign:'center', fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:13, color: wasAdded ? 'var(--green-deep)' : 'transparent', transition:'color 0.3s' }}>
            Your name has been added to the guest book.
          </div>
        </form>`;
    };

    const GuestRow = ({ guest, onEdit, onDelete }) => {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(guest.name);
      const [status, setStatus] = useState('coming');
      const inputRef = useRef(null);
      useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);
      const commit = () => {
        if (status === 'not-coming') { onDelete(guest.id); setEditing(false); return; }
        const t = draft.trim(); if (t) onEdit(guest.id, t); setEditing(false);
      };
      const cancel = () => { setDraft(guest.name); setStatus('coming'); setEditing(false); };
      return html`
        <li style=${{ display:'flex', alignItems: editing?'flex-start':'center', gap:10, padding:'10px 4px 10px 0', borderBottom:'1px dashed rgba(184,137,58,0.35)', animation:'fadeUp 0.4s ease-out both', flexWrap: editing?'wrap':'nowrap' }}>
          <div style=${{ flex:'0 0 auto', width:22, height:22, borderRadius:'50%', background:'radial-gradient(circle at 35% 35%,#d9a94a,#8a6322 70%,#5a3e12)', boxShadow:'0 1px 1px rgba(0,0,0,0.25),inset 0 1px 1px rgba(255,255,255,0.3)', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff6d5', fontFamily:'MedievalSharp, serif', fontSize:13, lineHeight:1, marginTop: editing?6:0 }}>✓</div>
          ${editing ? html`
            <div style=${{ display:'flex', flexDirection:'column', gap:6, flex:1, minWidth:0 }}>
              <input ref=${inputRef} value=${draft}
                onChange=${(e) => setDraft(e.target.value)}
                onKeyDown=${(e) => { if(e.key==='Enter') commit(); else if(e.key==='Escape') cancel(); }}
                style=${{ ...parchmentField, padding:'6px 8px', fontSize:15, width:'100%' }} />
              <select value=${status} onChange=${(e) => setStatus(e.target.value)}
                style=${{ ...parchmentField, padding:'6px 8px', fontSize:14, width:'100%', cursor:'pointer' }}>
                <option value="coming">Coming</option>
                <option value="not-coming">Not Coming</option>
              </select>
            </div>` : html`
            <div style=${{ flex:1, minWidth:0 }}>
              <div style=${{ fontFamily:'IM Fell English, serif', fontSize:17, color:'var(--ink)', lineHeight:1.2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${guest.name}</div>
            </div>`}
          ${!editing && html`
            <button onClick=${() => { setDraft(guest.name); setStatus('coming'); setEditing(true); }}
              style=${{ flex:'0 0 auto', fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:13, color:'var(--ink-soft)', padding:'6px 10px', border:'1px solid rgba(184,137,58,0.4)', borderRadius:2, background:'rgba(255,248,220,0.35)' }}
              aria-label=${'Edit ' + guest.name}>edit</button>`}
          ${editing && html`
            <div style=${{ display:'flex', flexDirection:'column', gap:6, flex:'0 0 auto' }}>
              <button onClick=${commit} style=${{ fontFamily:'MedievalSharp, serif', fontSize:13, color:'#fff6d5', padding:'6px 12px', borderRadius:2, background:'linear-gradient(180deg,#4a7a3a,#2f5224)', border:'1px solid #1e3818' }}>save</button>
              <button onClick=${cancel} style=${{ fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:12, color:'var(--ink-soft)', padding:'4px 8px', borderRadius:2, background:'transparent', border:'1px solid rgba(184,137,58,0.3)' }}>cancel</button>
            </div>`}
        </li>`;
    };

    const GuestList = ({ guests, onEdit, onDelete }) => {
      if (!guests.length) return html`
        <div style=${{ textAlign:'center', padding:'18px 12px', fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:14, color:'var(--ink-soft)', opacity:0.75 }}>
          No names in the guest book yet — be the first to answer the call.
        </div>`;
      return html`
        <ul style=${{ listStyle:'none', padding:0, margin:0 }}>
          ${guests.map(g => html`<${GuestRow} key=${g.id} guest=${g} onEdit=${onEdit} onDelete=${onDelete} />`)}
        </ul>`;
    };

    Object.assign(window, { RsvpForm, GuestList, parchmentField, goldButton });
  })();
  </script>

  <!-- ── tweaks ── -->
  <script>
  (function() {
    const { useState: useStateT, useEffect: useEffectT } = React;

    const TweaksPanel = ({ tweaks, onChange }) => {
      const [open, setOpen] = useStateT(false);
      const [active, setActive] = useStateT(false);
      useEffectT(() => {
        const onMsg = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setActive(true);
          if (d.type === '__deactivate_edit_mode') { setActive(false); setOpen(false); }
        };
        window.addEventListener('message', onMsg);
        window.parent && window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);
      if (!active) return null;
      const set = (key, value) => {
        onChange({ ...tweaks, [key]: value });
        window.parent && window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
      };
      const fields = [
        ['eventTitle','Title','text'],['subtitle','Subtitle','text'],['hostLine','Host line','text'],
        ['eventDate','Target date (for countdown)','datetime-local'],['eventDateDisplay','Date (display)','text'],
        ['eventTimeDisplay','Time (display)','text'],['venueName','Venue name','text'],
        ['venueAddress','Address','text'],['venueNote','Venue note','text'],
        ['details','Details','textarea'],['rsvpBy','RSVP-by line','text'],['contactLine','Contact','text'],
      ];
      const pf = window.parchmentField;
      return html`
        <${React.Fragment}>
          <button onClick=${() => setOpen(o => !o)} style=${{ position:'fixed', bottom:16, right:16, zIndex:50, padding:'10px 14px', borderRadius:999, fontFamily:'MedievalSharp, serif', fontSize:14, color:'#fff6d5', background:'linear-gradient(180deg,#4a7a3a,#2f5224)', border:'1px solid #1e3818', boxShadow:'0 3px 10px rgba(0,0,0,0.3)' }}>✎ Tweaks</button>
          ${open && html`
            <div style=${{ position:'fixed', bottom:64, right:16, zIndex:50, width:'min(360px,calc(100vw - 32px))', maxHeight:'70vh', overflowY:'auto', background:'linear-gradient(180deg,#f4ead0,#e4d09c)', border:'1px solid rgba(184,137,58,0.7)', borderRadius:4, boxShadow:'0 10px 30px rgba(20,10,0,0.4)', padding:14 }}>
              <div style=${{ fontFamily:'MedievalSharp, serif', fontSize:18, color:'var(--ink)', borderBottom:'1px solid rgba(184,137,58,0.4)', paddingBottom:6, marginBottom:10 }}>Tweaks</div>
              <div style=${{ display:'flex', flexDirection:'column', gap:10 }}>
                ${fields.map(([key, label, type]) => html`
                  <label key=${key} style=${{ display:'flex', flexDirection:'column', gap:3 }}>
                    <span style=${{ fontFamily:'IM Fell English, serif', fontStyle:'italic', fontSize:12, color:'var(--ink-soft)', letterSpacing:'0.04em' }}>${label}</span>
                    ${type === 'textarea'
                      ? html`<textarea value=${tweaks[key]||''} onChange=${(e)=>set(key,e.target.value)} rows="3" style=${{...pf,fontSize:13,resize:'vertical'}} />`
                      : html`<input type=${type} value=${tweaks[key]||''} onChange=${(e)=>set(key,e.target.value)} style=${{...pf,fontSize:13,padding:'6px 8px'}} />`}
                  </label>`)}
                <button onClick=${() => { if(confirm('Clear all RSVPs from this device?')){ localStorage.removeItem('callie_birthday_rsvps_v1'); location.reload(); } }}
                  style=${{ marginTop:4, padding:'8px 10px', fontFamily:'IM Fell English, serif', fontSize:13, color:'var(--ink)', background:'rgba(184,80,60,0.15)', border:'1px solid rgba(184,80,60,0.45)', borderRadius:2 }}>Clear all RSVPs (dev)</button>
              </div>
            </div>`}
        <//>`;
    };

    window.TweaksPanel = TweaksPanel;
  })();
  </script>

  <!-- ── app ── -->
  <script>
  (function() {
    const { useState: useStateA, useEffect: useEffectA } = React;

    const SectionHeader = ({ title, kicker }) => html`
      <div style=${{ textAlign:'center', margin:'4px 0 6px' }}>
        <div style=${{ fontFamily:'IM Fell English, serif', fontStyle:'italic', letterSpacing:'0.18em', textTransform:'lowercase', color:'var(--gold)', opacity:0.9, fontSize:'18px' }}>${kicker}</div>
        <div style=${{ fontFamily:'MedievalSharp, serif', color:'var(--ink)', marginTop:2, lineHeight:1.1, fontSize:'24px' }}>${title}</div>
      </div>`;

    const DetailRow = ({ label, children }) => html`
      <div style=${{ display:'flex', gap:12, padding:'8px 0', borderBottom:'1px dashed rgba(184,137,58,0.35)' }}>
        <div style=${{ flex:'0 0 72px', fontFamily:'MedievalSharp, serif', letterSpacing:'0.06em', color:'var(--gold)', paddingTop:2, fontSize:'19px', fontWeight:700 }}>${label}</div>
        <div style=${{ flex:1, fontFamily:'IM Fell English, serif', lineHeight:1.35, color:'var(--ink)', fontSize:'18px' }}>${children}</div>
      </div>`;

    const DetailsBlock = ({ tweaks }) => html`
      <div>
        <${DetailRow} label="Date">${tweaks.eventDateDisplay}<//>
        <${DetailRow} label="Time"><span style=${{ whiteSpace:'pre-line' }}>${tweaks.eventTimeDisplay}</span><//>
        <${DetailRow} label="Where">
          <div style=${{ fontSize:'18px' }}>${tweaks.venueName}</div>
          <div style=${{ fontStyle:'italic', color:'var(--ink-soft)', marginTop:1, fontSize:'18px', fontWeight:'600', whiteSpace:'pre-line' }}>${tweaks.venueAddress}</div>
          ${tweaks.venueNote && html`<div style=${{ fontSize:13.5, color:'var(--ink-soft)', marginTop:4, opacity:0.9 }}>${tweaks.venueNote}</div>`}
        <//>
        <${DetailRow} label="Notes"><span style=${{ textWrap:'pretty' }}>${tweaks.details}</span><//>
      </div>`;

    function App() {
      const [tweaks, setTweaks] = useStateA(window.__TWEAKS__);
      const [guests, setGuests] = useStateA([]);
      const sb = window._sb;

      useEffectA(() => {
        sb.from('rsvps').select('*').order('created_at', { ascending: true })
          .then(({ data }) => { if (data) setGuests(data); });
        const channel = sb.channel('rsvps-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rsvps' }, (payload) => {
            setGuests(g => g.some(x => x.id === payload.new.id) ? g : [...g, payload.new]);
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rsvps' }, (payload) => {
            setGuests(g => g.map(x => x.id === payload.new.id ? payload.new : x));
          })
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'rsvps' }, (payload) => {
            setGuests(g => g.filter(x => x.id !== payload.old.id));
          })
          .subscribe();
        return () => channel.unsubscribe();
      }, []);

      const addGuest = async (name) => {
        const id = 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
        setGuests(g => [...g, { id, name, created_at: new Date().toISOString() }]);
        await sb.from('rsvps').insert({ id, name });
      };
      const editGuest = async (id, name) => {
        setGuests(g => g.map(x => x.id === id ? { ...x, name } : x));
        await sb.from('rsvps').update({ name }).eq('id', id);
      };
      const deleteGuest = async (id) => {
        setGuests(g => g.filter(x => x.id !== id));
        await sb.from('rsvps').delete().eq('id', id);
      };

      return html`
        <div style=${{ maxWidth:460, margin:'0 auto', padding:'0 0 120px', position:'relative' }}>
          <div style=${{ position:'relative', marginBottom:-4 }}>
            <${ShireScene} />
            <div style=${{ position:'absolute', left:0, right:0, bottom:-1, height:18, background:'linear-gradient(180deg,transparent,rgba(42,31,20,0.18))' }} />
          </div>
          <div style=${{ background:'linear-gradient(180deg,rgba(255,248,220,0.65),rgba(230,213,168,0.75))', border:'1px solid rgba(184,137,58,0.55)', borderRadius:3, boxShadow:'0 8px 24px rgba(40,25,10,0.25),inset 0 1px 0 rgba(255,255,255,0.45)', position:'relative', zIndex:2, margin:'4px 20px 0px', padding:'24px' }}>
            <div style=${{ position:'absolute', top:6, left:6 }}><${CornerFlourish} size=${44} /></div>
            <div style=${{ position:'absolute', top:6, right:6 }}><${CornerFlourish} size=${44} flip=${true} /></div>
            <div style=${{ position:'absolute', bottom:6, left:6, transform:'scaleY(-1)' }}><${CornerFlourish} size=${44} /></div>
            <div style=${{ position:'absolute', bottom:6, right:6, transform:'scale(-1,-1)' }}><${CornerFlourish} size=${44} /></div>
            <div style=${{ display:'flex', justifyContent:'center', marginTop:-115, marginBottom:10, position:'relative', zIndex:3 }}>
              <${HobbitDoor} size=${170} />
            </div>
            <div style=${{ textAlign:'center', fontFamily:'IM Fell English, serif', fontStyle:'italic', letterSpacing:'0.08em', color:'var(--ink-soft)', marginBottom:10, marginTop:6, fontSize:'16px', whiteSpace:'pre-line' }}>
              ${tweaks.hostLine}
            </div>
            <h1 style=${{ fontFamily:'MedievalSharp, serif', textAlign:'center', margin:'6px 0 4px', fontSize:'clamp(28px,8vw,38px)', lineHeight:1.05, color:'var(--ink)', textShadow:'0 1px 0 rgba(255,243,200,0.7)', letterSpacing:'0.01em' }}>
              ${tweaks.eventTitle}
            </h1>
            <div style=${{ textAlign:'center', fontFamily:'IM Fell English, serif', fontStyle:'italic', color:'var(--ink-soft)', padding:'0 6px', marginTop:6, fontSize:'20px' }}>
              ${tweaks.subtitle}
            </div>
            <div style=${{ margin:'18px 0 14px' }} />
            <${Countdown} targetIso=${tweaks.eventDate} />
            <div style=${{ margin:'22px 0 14px' }}><${KnotDivider} /></div>
            <${DetailsBlock} tweaks=${tweaks} />
            <div style=${{ margin:'22px 0 16px' }}><${KnotDivider} /></div>
            <${SectionHeader} title="Answer the Call" kicker="~ RSVP ~" />
            <div style=${{ marginTop:8, marginBottom:18 }}>
              <${RsvpForm} onAdd=${addGuest} />
            </div>
            <${SectionHeader} title="The Fellowship So Far" kicker=${'~ ' + guests.length + ' ' + (guests.length===1?'party':'parties') + ' coming ~'} />
            <div style=${{ marginTop:6, padding:'2px 4px 4px', borderTop:'1px solid rgba(184,137,58,0.25)', borderBottom:'1px solid rgba(184,137,58,0.25)' }}>
              <${GuestList} guests=${guests} onEdit=${editGuest} onDelete=${deleteGuest} />
            </div>
            <div style=${{ margin:'24px 0 6px' }}><${KnotDivider} /></div>
            <div style=${{ display:'flex', alignItems:'center', gap:12, marginTop:10 }}>
              <${WaxSeal} letter="C" size=${56} />
              <div style=${{ flex:1 }}>
                <div style=${{ fontFamily:'MedievalSharp, serif', color:'var(--ink)', fontSize:'20px' }}>${tweaks.rsvpBy}</div>
                <div style=${{ fontFamily:'IM Fell English, serif', fontStyle:'italic', color:'var(--ink-soft)', marginTop:2, fontSize:'16px', whiteSpace:'pre-line' }}>${tweaks.contactLine}</div>
              </div>
            </div>
          </div>
          <div style=${{ textAlign:'center', fontFamily:'MedievalSharp, serif', fontSize:14, color:'var(--ink-soft)', marginTop:16, opacity:0.75 }}>
            ✦  May your road go ever on  ✦
          </div>
          <${FallingLeaves} />
          <${TweaksPanel} tweaks=${tweaks} onChange=${setTweaks} />
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  })();
  </script>
</body>
</html>
